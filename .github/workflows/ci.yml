name: CI

on:
  push:
    branches: [main]

concurrency:
  # :main moves to whichever build finishes last, so pushes must not overlap.
  group: ci-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  images:
    name: images (GHCR)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Commit tag
        run: echo "TAG=sha-${GITHUB_SHA::7}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The server is amd64. No provenance or SBOM: each would be one more
      # untagged package version counted against the storage.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          tags: ghcr.io/zerox9dev/vidzilla-bot:${{ env.TAG }}
          labels: org.opencontainers.image.source=https://github.com/zerox9dev/Vidzilla
          cache-from: type=gha,scope=bot
          cache-to: type=gha,scope=bot,mode=max
      # --prefer-index=false copies the manifest as it is instead of wrapping
      # it in an index, so the tag adds no package version.
      - name: Move main to this commit
        run: |
          docker buildx imagetools create --prefer-index=false \
            -t "ghcr.io/zerox9dev/vidzilla-bot:main" \
            "ghcr.io/zerox9dev/vidzilla-bot:$TAG"
      # The free plan's package storage is small. Ten versions is ten deploys
      # to roll back to; older ones are rebuilt from their commit.
      - name: Keep the last ten versions
        uses: actions/delete-package-versions@v5
        with:
          package-name: vidzilla-bot
          package-type: container
          min-versions-to-keep: 10
