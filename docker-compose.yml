services:
  vidzilla-bot:
    build:
      context: .
      dockerfile: Dockerfile
    image: vidzilla-bot:latest
    container_name: vidzilla-bot
    working_dir: /app
    environment:
      BOT_TOKEN: ${BOT_TOKEN:-}
      BOT_MODE: ${BOT_MODE:-polling}
      PORT: ${PORT:-8000}
      HOST: ${HOST:-0.0.0.0}
      WEBHOOK_PATH: ${WEBHOOK_PATH:-}
      WEBHOOK_URL: ${WEBHOOK_URL:-}
      MONGODB_URI: ${MONGODB_URI:-}
      MONGODB_DB_NAME: ${MONGODB_DB_NAME:-}
      MONGODB_USERS_COLLECTION: ${MONGODB_USERS_COLLECTION:-users}
      ADMIN_IDS: ${ADMIN_IDS:-}
    ports:
      - "${PORT:-8000}:${PORT:-8000}"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen(f'http://localhost:{__import__(\"os\").environ.get(\"PORT\",\"8000\")}/health', timeout=3).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
